name: Deploy

# Attach the plugin zip to every published release. The top-level folder must be
# "aiwos-two-factor" (the package slug).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    name: Create release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p build/aiwos-two-factor
          rsync -a ./ build/aiwos-two-factor/ --exclude build --exclude .git --exclude .github --exclude tests --exclude phpcs.xml --exclude phpstan.neon --exclude .gitignore --exclude .wp-env.json
          cd build && zip -X -r "aiwos-two-factor-${{ github.event.release.tag_name }}.zip" aiwos-two-factor

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/aiwos-two-factor-${{ github.event.release.tag_name }}.zip
